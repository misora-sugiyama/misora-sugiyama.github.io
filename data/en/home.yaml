about:
  kicker: 01 — Profile
  sectionKicker: 05 — Bio
  title: Bio.
  paragraphs:
    - My work sits at the intersection of computer vision and generative AI. I am interested in models that do more than create convincing pixels—models that understand structure, preserve intent, and translate visual information across domains.
    - Current interests include image and video generation, image-to-image models, controllable synthesis, and the representations that connect perception with generation.
  quote: How can generative models become better visual reasoners—not only better image makers?

