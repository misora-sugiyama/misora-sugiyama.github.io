publications:
  kicker: 02 — Publications
  title: Selected publications
  intro: Two public arXiv preprints spanning computer vision, generative modeling, image editing, and visual reasoning.
  items:
    - year: "2026"
      status: arXiv preprint · cs.CV
      title: Image-Space Rule Discovery
      authors: Misora Sugiyama, Toya Oyama, Hirokatsu Kataoka
      copy: Introduces WISRD, a benchmark for testing whether image-editing models can interpret visual instructions, infer rules, and complete worksheet-style tasks directly in image space.
      url: https://arxiv.org/abs/2608.00490
      linkLabel: View on arXiv
      tags:
        - Image Editing
        - Visual Reasoning
        - Benchmark
    - year: "2025"
      status: arXiv · ICCV 2025 Workshop
      title: Simple Visual Artifact Detection in Sora-Generated Videos
      authors: Misora Sugiyama, Hirokatsu Kataoka
      copy: A multi-label framework for detecting four common types of visual artifacts in Sora-generated videos, achieving 94.14% average classification accuracy with ResNet-50.
      url: https://arxiv.org/abs/2504.21334
      linkLabel: View on arXiv
      tags:
        - Video Generation
        - Artifact Detection
        - Multi-label Classification

