about:
  kicker: 01 — Profile
  sectionKicker: 05 — Bio
  title: プロフィール
  paragraphs:
    - コンピュータビジョンと生成AIの交差領域で研究しています。見栄えのよい画像を作るだけでなく、構造を理解し、意図を保ち、異なるドメイン間で視覚情報を変換できるモデルに関心があります。
    - 現在の主な関心は、画像・動画生成、Image-to-Imageモデル、制御可能な生成、そして認識と生成を結ぶ表現学習です。
  quote: 生成モデルを、優れた画像生成器から、優れた視覚的推論器へ進化させるには何が必要か。

research:
  kicker: 04 — Projects
  title: 研究テーマ
  items:
    - number: "01"
      title: Computer Vision
      copy: 物体、構造、文脈、変化を視覚データから捉える表現学習を探究します。
      tags:
        - 表現学習
        - 視覚理解
    - number: "02"
      title: Image & Video Generation
      copy: 一貫性、制御性、表現力を備えた画像・動画生成モデルを研究します。
      tags:
        - 拡散モデル
        - 時間的一貫性
    - number: "03"
      title: Image-to-Image Models
      copy: 重要な内容や意図を保ちながら、画像を異なるドメインへ変換する方法を研究します。
      tags:
        - 画像変換
        - 制御

publications:
  kicker: 02 — Publications
  title: 主要な研究成果
  intro: コンピュータビジョンと生成モデルに関する公開済みarXivプレプリントが1本、公開準備中のACCV論文が1本あります。
  items:
    - year: "2025"
      status: arXiv · ICCV 2025 Workshop
      title: Simple Visual Artifact Detection in Sora-Generated Videos
      authors: Misora Sugiyama, Hirokatsu Kataoka
      copy: Sora生成動画に見られる4種類の視覚的アーティファクトを検出するマルチラベル分類手法を提案し、ResNet-50で平均94.14%の分類精度を達成しました。
      url: https://arxiv.org/abs/2504.21334
      linkLabel: arXivで見る
      tags:
        - 動画生成
        - アーティファクト検出
        - マルチラベル分類
    - year: 近日公開
      status: ACCV投稿論文 · arXiv公開準備中
      title: ACCV論文
      copy: 現在arXiv版のアップロードを準備しています。公開後に正式タイトル、著者一覧、概要、リンクを追加します。
      tags:
        - Computer Vision
        - 生成モデル
  note: ACCV論文の詳細は、arXiv版の公開後すぐに更新します。

