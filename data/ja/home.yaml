about:
  kicker: 01 — Profile
  sectionKicker: 05 — Bio
  title: プロフィール
  paragraphs:
    - コンピュータビジョンと生成AIを基盤に、視覚知能（Visual Intelligence）の研究に取り組んでいます。単にもっともらしい画像を生成するだけでなく、視覚的な構造を理解し、意図を保ちながら、異なるドメイン間で情報を変換できる知能の実現に関心があります。
    - 現在の主な関心は、画像・動画生成、Image-to-Imageモデル、制御可能な生成、表現学習です。
  quote: 生成モデルを、優れた画像生成器から、優れた視覚的推論器へ進化させるには何が必要か。

research:
  kicker: 04 — Projects
  title: 研究テーマ
  items:
    - number: "01"
      title: Computer Vision
      copy: 物体、構造、文脈、変化を視覚データから捉える表現学習を探究します。
      tags:
        - 表現学習
        - 視覚理解
    - number: "02"
      title: Image & Video Generation
      copy: 一貫性、制御性、表現力を備えた画像・動画生成モデルを研究します。
      tags:
        - 拡散モデル
        - 時間的一貫性
    - number: "03"
      title: Image-to-Image Models
      copy: 重要な内容や意図を保ちながら、画像を異なるドメインへ変換する方法を研究します。
      tags:
        - 画像変換
        - 制御

publications:
  kicker: 02 — Publications
  title: 研究成果
  intro: コンピュータビジョン、生成モデル、画像編集、視覚推論に関するarXiv論文を2本公開しています。
  items:
    - year: "2026"
      status: arXiv論文 · cs.CV
      title: Image-Space Rule Discovery
      authors: Misora Sugiyama, Toya Oyama, Hirokatsu Kataoka
      copy: 画像編集モデルが画像内の指示を読み取り、規則を推論し、ワークシート形式の課題を画像空間で完結できるかを評価するWISRDベンチマークを提案しました。
      url: https://arxiv.org/abs/2608.00490
      linkLabel: arXivで見る
      tags:
        - 画像編集
        - 視覚推論
        - ベンチマーク
    - year: "2025"
      status: arXiv · ICCV 2025 Workshop
      title: Simple Visual Artifact Detection in Sora-Generated Videos
      authors: Misora Sugiyama, Hirokatsu Kataoka
      copy: Sora生成動画に見られる4種類の視覚的アーティファクトを検出するマルチラベル分類手法を提案し、ResNet-50で平均94.14%の分類精度を達成しました。
      url: https://arxiv.org/abs/2504.21334
      linkLabel: arXivで見る
      tags:
        - 動画生成
        - アーティファクト検出
        - マルチラベル分類

